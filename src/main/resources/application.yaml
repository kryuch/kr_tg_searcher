telegram:
  python:
    server:
      url: http://localhost:8081
    timeout:
      connect: 50000
      read: 600000

server:
  port: 8080

spring:
  liquibase:
    enabled: false  # Отключаем автоконфигурацию!

  h2:
    console:
      enabled: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Europe/Moscow
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://localhost:5432/krrg
    driver-class-name: org.postgresql.Driver
    username: krrg
    password: H.hbr2123

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate  # <-- Меняем none на validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: never  # Отключаем, чтобы не мешал Liquibase

