<div class="icontent">
    <script th:src="@{/js/employee.js}"></script>
    <style>
        .employee-layout { display: flex; gap: 24px; align-items: flex-start; }
        .employee-general { flex: 0 0 340px; }
        .employee-profiles { flex: 1 1 auto; min-width: 0; }
        .employee-general label { display: block; margin-top: 8px; font-weight: bold; }
        .employee-general input[type=text],
        .employee-general select { width: 100%; box-sizing: border-box; }
        .profile-head { margin-bottom: 10px; }
        .profile-head label { margin-right: 6px; }
        .profile-head input { margin-right: 16px; }
        .profile-toolbar, .project-toolbar { margin-bottom: 8px; }

        /* вертикальные вкладки проектов (jQuery UI) */
        .ui-tabs-vertical { width: 100%; }
        .ui-tabs-vertical .ui-tabs-nav { padding: .2em .1em .2em .2em; float: left; width: 12em; }
        .ui-tabs-vertical .ui-tabs-nav li { clear: left; width: 100%; border-bottom-width: 1px !important; border-right-width: 0 !important; margin: 0 -1px .2em 0; }
        .ui-tabs-vertical .ui-tabs-nav li a { display: block; width: 100%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ui-tabs-vertical .ui-tabs-nav li.ui-tabs-active { padding-bottom: 0; padding-right: .1em; border-right-width: 1px !important; }
        .ui-tabs-vertical .ui-tabs-panel { float: left; width: calc(100% - 14em); box-sizing: border-box; padding: 1em; }
        .project-panel label { display: block; margin-top: 8px; font-weight: bold; }
        .project-panel input[type=text],
        .project-panel input[type=date],
        .project-panel textarea { width: 100%; box-sizing: border-box; }
        .grades-box { display: inline-block; vertical-align: top; min-width: 220px; }
    </style>

    <form action="#" th:action="@{/employees/save}" th:object="${employee}" method="post"
          class="edit-form form-horizontal">

        <div class="employee-layout">

            <!-- ЛЕВАЯ ЧАСТЬ: общая информация -->
            <div class="employee-general">
                <h3>Общая информация</h3>

                <label>Фамилия</label>
                <input type="text" th:field="*{lastName}"/>

                <label>Имя</label>
                <input type="text" th:field="*{firstName}"/>

                <label>Отчество</label>
                <input type="text" th:field="*{middleName}"/>

                <label>Пол</label>
                <select th:field="*{male}">
                    <option th:value="true">Мужской</option>
                    <option th:value="false">Женский</option>
                </select>

                <label>Дата рождения</label>
                <input type="date" th:field="*{birthDate}"/>

                <label>Гражданство</label>
                <select th:field="*{citizenship}">
                    <option value="">-- не выбрано --</option>
                    <option th:each="c : ${citizenships}"
                            th:value="${c.code}"
                            th:text="${c.name}">Гражданство</option>
                </select>

                <label>Государство</label>
                <select th:field="*{state}">
                    <option value="">-- не выбрано --</option>
                    <option th:each="c : ${states}"
                            th:value="${c.code}"
                            th:data-id="${c.id}"
                            th:text="${c.name}">Государство</option>
                </select>

                <label>Город</label>
                <select th:field="*{city}" th:data-url="@{/employees/cities}" disabled>
                    <option value="">-- не выбрано --</option>
                </select>

                <h3>Контакты</h3>
                <th:block th:each="ct, s : ${T(ru.kryuch.krtg.searcher.type.ContactType).values()}">
                    <label th:text="${ct.value}">тип</label>
                    <input type="hidden" th:name="|contacts[${s.index}].type|" th:value="${ct.name()}"/>
                    <input type="text" th:name="|contacts[${s.index}].value|"/>
                </th:block>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ: профили во вкладках -->
            <div class="employee-profiles">
                <div id="right-tabs">
                    <ul>
                        <li><a href="#tab-profiles">Профили</a></li>
                        <li><a href="#tab-languages">Языки</a></li>
                    </ul>

                    <div id="tab-profiles">
                        <div class="profile-toolbar">
                            <button type="button" id="add-profile" class="save">Добавить профиль</button>
                        </div>
                        <div id="profile-tabs">
                            <ul></ul>
                        </div>
                    </div>

                    <div id="tab-languages">
                        <div class="profile-toolbar">
                            <button type="button" id="add-language" class="save">Добавить язык</button>
                        </div>
                        <table class="list language-table">
                            <thead>
                            <tr>
                                <th>Язык</th>
                                <th>Уровень</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="languages-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <br/>
        <button class="save" type="submit">Сохранить</button>

        <template id="language-template">
            <tr>
                <td>
                    <select name="languages[__L__].language">
                        <option value="">-- не выбрано --</option>
                        <option th:each="l : ${languages}"
                                th:value="${l.code}"
                                th:text="${l.name}">Язык</option>
                    </select>
                </td>
                <td>
                    <select name="languages[__L__].level">
                        <option value="">-- не выбрано --</option>
                        <option value="A1">A1 (начальный)</option>
                        <option value="A2">A2 (элементарный)</option>
                        <option value="B1">B1 (средний)</option>
                        <option value="B2">B2 (выше среднего)</option>
                        <option value="C1">C1 (продвинутый)</option>
                        <option value="C2">C2 (свободное владение)</option>
                        <option value="NATIVE">Родной</option>
                    </select>
                </td>
                <td><button type="button" class="remove-language">Удалить</button></td>
            </tr>
        </template>

        <!-- Шаблон профиля: __P__ заменяется на индекс профиля -->
        <script type="text/x-template" id="profile-template">
            <div class="profile-head">
                <label>Название</label>
                <input type="text" data-tab-title="1" name="profiles[__P__].name"/>

                <label>Ставка в час</label>
                <input type="number" step="0.01" name="profiles[__P__].ratePerHour"/>
                <br/><br/>
                <label>Навыки (через запятую)</label>
                <input type="text" size="40" name="profiles[__P__].skills"/>

                <label>Грейды</label>
                <div class="grades-box">
                    <select class="grades-select" id="grades-__P__" name="profiles[__P__].grades" multiple="multiple"></select>
                </div>
            </div>

            <div class="project-toolbar">
                <button type="button" class="add-project save">Добавить проект</button>
            </div>

            <div class="projects-tabs">
                <ul></ul>
            </div>
        </script>

        <template id="grade-options-template">
            <option th:each="g : ${grades}"
                    th:value="${g.code}"
                    th:text="${g.name}"></option>
        </template>

        <!-- Шаблон проекта: __P__ - индекс профиля, __R__ - индекс проекта -->
        <script type="text/x-template" id="project-template">
            <label>Проект</label>
            <input type="text" data-tab-title="1" name="profiles[__P__].projects[__R__].name"/>

            <label>Организация</label>
            <input type="text" name="profiles[__P__].projects[__R__].organisation"/>

            <label>Роль</label>
            <input type="text" name="profiles[__P__].projects[__R__].role"/>

            <label>Начало</label>
            <input type="date" name="profiles[__P__].projects[__R__].startAt"/>

            <label>Окончание</label>
            <input type="date" name="profiles[__P__].projects[__R__].endAt"/>

            <label>Навыки (через запятую)</label>
            <input type="text" name="profiles[__P__].projects[__R__].skills"/>

            <label>Описание</label>
            <textarea rows="4" name="profiles[__P__].projects[__R__].description"></textarea>

            <label>Прогресс</label>
            <input type="text" name="profiles[__P__].projects[__R__].progress"/>
        </script>

        <script>

        </script>
    </form>
</div>
