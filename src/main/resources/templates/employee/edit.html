<div class="icontent">
    <script th:src="@{/js/employee.js}"></script>
    <style>
        .employee-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .employee-general {
            flex: 0 0 340px;
        }

        .employee-profiles {
            flex: 1 1 auto;
            min-width: 0;
        }

        .employee-general label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
        }

        .employee-general input[type=text],
        .employee-general select {
            width: 100%;
            box-sizing: border-box;
        }

        .profile-head {
            margin-bottom: 10px;
        }

        .profile-head label {
            margin-right: 6px;
        }

        .profile-head input {
            margin-right: 16px;
        }

        .profile-toolbar, .project-toolbar {
            margin-bottom: 8px;
        }

        /* вертикальные вкладки проектов (jQuery UI) */
        .ui-tabs-vertical {
            width: 100%;
        }

        .ui-tabs-vertical .ui-tabs-nav {
            padding: .2em .1em .2em .2em;
            float: left;
            width: 12em;
        }

        .ui-tabs-vertical .ui-tabs-nav li {
            clear: left;
            width: 100%;
            border-bottom-width: 1px !important;
            border-right-width: 0 !important;
            margin: 0 -1px .2em 0;
        }

        .ui-tabs-vertical .ui-tabs-nav li a {
            display: block;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ui-tabs-vertical .ui-tabs-nav li.ui-tabs-active {
            padding-bottom: 0;
            padding-right: .1em;
            border-right-width: 1px !important;
        }

        .ui-tabs-vertical .ui-tabs-panel {
            float: left;
            width: calc(100% - 14em);
            box-sizing: border-box;
            padding: 1em;
        }

        .project-panel label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
        }

        .project-panel input[type=text],
        .project-panel input[type=date],
        .project-panel textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .grades-box {
            display: inline-block;
            vertical-align: top;
            min-width: 220px;
        }

        .education-table {
            width: 100%;
        }

        .education-table td {
            padding: 4px 6px;
            vertical-align: middle;
        }

        .education-table select,
        .education-table input[type=number] {
            width: 100%;
            box-sizing: border-box;
        }

        .education-table .edu-label {
            font-weight: bold;
            white-space: nowrap;
            width: 1%;
        }

        .education-table .edu-remove {
            width: 1%;
            text-align: center;
        }

        .education-table .education-item {
            border-bottom: 2px solid #ccc;
        }

        .with-button {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .with-button select {
            flex: 1 1 auto;
            min-width: 0;
        }

        .university-dialog {
            min-width: 360px;
        }

        .university-dialog label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
        }

        .university-dialog input {
            width: 100%;
            box-sizing: border-box;
        }

        .university-dialog .dialog-buttons {
            margin-top: 14px;
            text-align: right;
        }

        .profile-head .with-button {
            display: inline-flex;
            vertical-align: middle;
            margin-right: 16px;
        }

        .skills-box {
            display: inline-block;
            vertical-align: top;
            min-width: 220px;
        }

        .project-panel .with-button {
            display: flex;
            align-items: flex-start;
        }

        .project-panel .skills-box {
            flex: 1 1 auto;
        }
    </style>

    <form action="#" th:action="@{/employees/save}" th:object="${employee}" method="post"
          class="edit-form form-horizontal">

        <div class="employee-layout">

            <!-- ЛЕВАЯ ЧАСТЬ: общая информация -->
            <div class="employee-general">
                <h3>Общая информация</h3>

                <label>Фамилия</label>
                <input type="text" th:field="*{lastName}"/>

                <label>Имя</label>
                <input type="text" th:field="*{firstName}"/>

                <label>Отчество</label>
                <input type="text" th:field="*{middleName}"/>

                <label>Пол</label>
                <select th:field="*{male}">
                    <option th:value="true">Мужской</option>
                    <option th:value="false">Женский</option>
                </select>

                <label>Дата рождения</label>
                <input type="date" th:field="*{birthDate}"/>

                <label>Гражданство</label>
                <select th:field="*{citizenshipId}">
                    <option value="">-- не выбрано --</option>
                    <option th:each="c : ${citizenships}"
                            th:value="${c.id}"
                            th:text="${c.name}">Гражданство
                    </option>
                </select>

                <label>Государство</label>
                <select th:field="*{stateId}">
                    <option value="">-- не выбрано --</option>
                    <option th:each="s : ${states}"
                            th:value="${s.id}"
                            th:text="${s.name}">Государство
                    </option>
                </select>

                <label>Город</label>
                <select th:field="*{cityId}" th:data-url="@{/employees/cities}" disabled>
                    <option value="">-- не выбрано --</option>
                </select>

                <h3>Контакты</h3>
                <th:block th:each="ct, s : ${T(ru.kryuch.krtg.searcher.type.ContactType).values()}">
                    <label th:text="${ct.value}">тип</label>
                    <input type="hidden" th:name="|contacts[${s.index}].type|" th:value="${ct.name()}"/>
                    <input type="text" th:name="|contacts[${s.index}].value|"/>
                </th:block>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ: профили во вкладках -->
            <div class="employee-profiles">
                <div id="right-tabs">
                    <ul>
                        <li><a href="#tab-profiles">Профили</a></li>
                        <li><a href="#tab-languages">Языки</a></li>
                        <li><a href="#tab-education">Образование</a></li>
                    </ul>

                    <div id="tab-profiles">
                        <div class="profile-toolbar">
                            <button type="button" id="add-profile" class="save">Добавить профиль</button>
                        </div>
                        <div id="profile-tabs">
                            <ul></ul>
                        </div>
                    </div>

                    <div id="tab-languages">
                        <div class="profile-toolbar">
                            <button type="button" id="add-language" class="save">Добавить язык</button>
                        </div>
                        <table class="list language-table">
                            <thead>
                            <tr>
                                <th>Язык</th>
                                <th>Уровень</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="languages-body"></tbody>
                        </table>
                    </div>

                    <div id="tab-education">
                        <div class="profile-toolbar">
                            <button type="button" id="add-education" class="save">Добавить образование</button>
                        </div>
                        <table class="list education-table" id="education-table"></table>
                    </div>

                </div>
            </div>
        </div>

        <br/>
        <button class="save" type="submit">Сохранить</button>

        <template id="skill-options-template">
            <option th:each="s : ${skills}"
                    th:value="${s.id}"
                    th:text="${s.name}"></option>
        </template>

        <template id="education-template">
            <tbody class="education-item">
            <tr>
                <td class="edu-label">Университет</td>
                <td>
                    <div class="with-button">
                        <select class="university-select" name="educations[__E__].universityId">
                            <option value="">-- не выбрано --</option>
                            <option th:each="u : ${universities}"
                                    th:value="${u.id}"
                                    th:text="${u.name}">Университет
                            </option>
                        </select>
                        <button type="button" class="add-dictionary" data-dict="university">Добавить</button>
                    </div>
                </td>
                <td class="edu-label">Специальность</td>
                <td>
                    <div class="with-button">
                        <select class="speciality-select" name="educations[__E__].specialityId">
                            <option value="">-- не выбрано --</option>
                            <option th:each="s : ${specialities}"
                                    th:value="${s.id}"
                                    th:text="${s.name}">Специальность
                            </option>
                        </select>
                        <button type="button" class="add-dictionary" data-dict="speciality">Добавить</button>
                    </div>
                </td>
                <td rowspan="3" class="edu-remove">
                    <button type="button" class="remove-education">Удалить</button>
                </td>
            </tr>
            <tr>
                <td class="edu-label">Тип обучения</td>
                <td>
                    <select name="educations[__E__].educationTypeId">
                        <option value="">-- не выбрано --</option>
                        <option th:each="t : ${educationTypes}"
                                th:value="${t.id}"
                                th:text="${t.name}">Тип
                        </option>
                    </select>
                </td>
                <td class="edu-label">Степень</td>
                <td>
                    <select name="educations[__E__].degreeId">
                        <option value="">-- не выбрано --</option>
                        <option th:each="d : ${educationDegree}"
                                th:value="${d.id}"
                                th:text="${d.name}">Степень
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="edu-label">Год начала</td>
                <td><input type="number" min="1950" max="2100" step="1" name="educations[__E__].startYear"/></td>
                <td class="edu-label">Год окончания</td>
                <td><input type="number" min="1950" max="2100" step="1" name="educations[__E__].endYear"/></td>
            </tr>
            </tbody>
        </template>

        <template id="language-template">
            <tr>
                <td>
                    <select name="languages[__L__].languageId">
                        <option value="">-- не выбрано --</option>
                        <option th:each="l : ${languages}"
                                th:value="${l.id}"
                                th:text="${l.name}">Язык
                        </option>
                    </select>
                </td>
                <td>
                    <select name="languages[__L__].level">
                        <option value="">-- не выбрано --</option>
                        <option value="A1">A1 (начальный)</option>
                        <option value="A2">A2 (элементарный)</option>
                        <option value="B1">B1 (средний)</option>
                        <option value="B2">B2 (выше среднего)</option>
                        <option value="C1">C1 (продвинутый)</option>
                        <option value="C2">C2 (свободное владение)</option>
                        <option value="NATIVE">Родной</option>
                    </select>
                </td>
                <td>
                    <button type="button" class="remove-language">Удалить</button>
                </td>
            </tr>
        </template>

        <!-- Шаблон профиля: __P__ заменяется на индекс профиля -->
        <script type="text/x-template" id="profile-template">
            <div class="profile-head">
                <label>Название</label>
                <input type="text" data-tab-title="1" name="profiles[__P__].name"/>

                <label>Направление</label>
                <div class="with-button">
                    <select class="specialization-select" name="profiles[__P__].developmentSpecializationId"></select>
                    <button type="button" class="add-dictionary" data-dict="specialization">Добавить</button>
                </div>

                <label>Ставка в час</label>
                <input type="number" step="0.01" name="profiles[__P__].ratePerHour"/>
                <br/><br/>
                <label>Навыки</label>
                <div class="with-button">
                    <div class="skills-box">
                        <select class="skills-select" id="skills-__P__" name="profiles[__P__].skillIds"
                                multiple="multiple"></select>
                    </div>
                    <button type="button" class="add-dictionary" data-dict="skill">Добавить</button>
                </div>

                <label>Грейды</label>
                <div class="grades-box">
                    <select class="grades-select" id="grades-__P__" name="profiles[__P__].gradeIds"
                            multiple="multiple"></select>
                </div>
            </div>

            <div class="project-toolbar">
                <button type="button" class="add-project save">Добавить проект</button>
            </div>

            <div class="projects-tabs">
                <ul></ul>
            </div>
        </script>

        <template id="specialization-options-template">
            <option value="">-- не выбрано --</option>
            <option th:each="s : ${specializations}"
                    th:value="${s.id}"
                    th:text="${s.name}"></option>
        </template>

        <template id="grade-options-template">
            <option th:each="g : ${grades}"
                    th:value="${g.id}"
                    th:text="${g.name}"></option>
        </template>

        <!-- Шаблон проекта: __P__ - индекс профиля, __R__ - индекс проекта -->
        <script type="text/x-template" id="project-template">
            <label>Проект</label>
            <input type="text" data-tab-title="1" name="profiles[__P__].projects[__R__].name"/>

            <label>Организация</label>
            <input type="text" name="profiles[__P__].projects[__R__].organisation"/>

            <label>Роль</label>
            <input type="text" name="profiles[__P__].projects[__R__].role"/>

            <label>Начало</label>
            <input type="date" name="profiles[__P__].projects[__R__].startAt"/>

            <label>Окончание</label>
            <input type="date" name="profiles[__P__].projects[__R__].endAt"/>

            <label>Навыки</label>
            <div class="with-button">
                <div class="skills-box">
                    <select class="skills-select" id="skills-__P__-__R__" name="profiles[__P__].projects[__R__].skills"
                            multiple="multiple"></select>
                </div>
                <button type="button" class="add-dictionary" data-dict="skill">Добавить</button>
            </div>

            <label>Описание</label>
            <textarea rows="4" name="profiles[__P__].projects[__R__].description"></textarea>

            <label>Прогресс</label>
            <input type="text" name="profiles[__P__].projects[__R__].progress"/>
        </script>

    </form>

    <div id="dictionary-dialog" class="dictionary-dialog" style="display:none">
        <h3 class="dict-title"></h3>
        <label>Код</label>
        <input type="text" class="dict-code" maxlength="10"/>
        <label>Название</label>
        <input type="text" class="dict-name" maxlength="255"/>
        <div class="dialog-buttons">
            <button type="button" class="dict-create save">Создать</button>
            <button type="button" class="dict-cancel">Отмена</button>
        </div>
    </div>
</div>
