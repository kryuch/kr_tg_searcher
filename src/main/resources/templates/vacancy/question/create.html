<div id="directionForm">
    <form action="#"
          th:action="${question.id} != null ? @{/vacancy/questions/{id}/edit(id=${question.id})} : @{/vacancy/questions/add}"
          th:object="${question}"
          class="edit-form form-horizontal"
          method="post"
          id="questionForm">

        <input type="hidden" th:field="*{id}" />

        <table class="list">
            <tr>
                <td><label for="text">Текст вопроса</label></td>
                <td>
                    <input type="text" th:field="*{text}" id="text" placeholder="Текст вопроса">
                    <span th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span>
                </td>
            </tr>
            <tr>
                <td><label for="type">Тип</label></td>
                <td>
                    <select th:field="*{type}" id="type">
                        <option th:each="qt : ${questionTypes}"
                                th:value="${qt}"
                                th:text="${qt}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
                </td>
            </tr>
            <tr>
                <td><label for="required">Обязательный</label></td>
                <td>
                    <input type="checkbox" th:field="*{required}" id="required">
                </td>
            </tr>
        </table>

        <div id="optionsBlock">
            <h3>Варианты ответа</h3>
            <table class="list" id="optionsTable">
                <tbody id="optionsBody">
                <tr th:each="opt, optStat : *{options}" class="option-row">
                    <td>
                        <input type="hidden"
                               th:name="${'options[' + optStat.index + '].id'}"
                               th:value="${opt.id}">
                        <input type="text"
                               th:name="${'options[' + optStat.index + '].text'}"
                               th:value="${opt.text}"
                               placeholder="Текст варианта">
                    </td>
                    <td>
                        <a class="btn-save remove-option" href="#">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <a class="save" id="addOption" href="#">Добавить вариант</a>
        </div>

        <table>
            <tr>
                <td></td>
                <td>
                    <button class="save" type="submit">Сохранить</button>
                </td>
            </tr>
        </table>
    </form>
</div>

<script th:inline="javascript">
    (function () {
        // типы вопросов, для которых показываются варианты ответа —
        // держите синхронно с QuestionService.SUPPORTS_OPTIONS
        var OPTION_TYPES = ['SINGLE_CHOICE', 'MULTIPLE_CHOICE'];

        var typeSelect = document.getElementById('type');
        var optionsBlock = document.getElementById('optionsBlock');
        var optionsBody = document.getElementById('optionsBody');
        var addBtn = document.getElementById('addOption');

        function toggleOptionsBlock() {
            var visible = OPTION_TYPES.indexOf(typeSelect.value) !== -1;
            optionsBlock.style.display = visible ? '' : 'none';
        }

        function reindex() {
            var rows = optionsBody.querySelectorAll('.option-row');
            rows.forEach(function (row, index) {
                row.querySelectorAll('input').forEach(function (input) {
                    input.name = input.name.replace(/options\[\d+]/, 'options[' + index + ']');
                });
            });
        }

        function addRow() {
            var row = document.createElement('tr');
            row.className = 'option-row';
            row.innerHTML =
                '<td>' +
                '<input type="hidden" name="options[0].id" value="">' +
                '<input type="text" name="options[0].text" placeholder="Текст варианта">' +
                '</td>' +
                '<td><a class="btn-save remove-option" href="#">Удалить</a></td>';
            optionsBody.appendChild(row);
            reindex();
        }

        typeSelect.addEventListener('change', toggleOptionsBlock);
        addBtn.addEventListener('click', function (e) {
            e.preventDefault();
            addRow();
        });
        optionsBody.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-option')) {
                e.preventDefault();
                e.target.closest('.option-row').remove();
                reindex();
            }
        });

        toggleOptionsBlock();
    })();
</script>
