<div class="vacancies-table-container">
    <script>
        function generateAnswer(button) {
            var $btn = jQuery(button);
            var $row = $btn.closest('tr');
            var $answerRow = $row.nextAll('.answer').first();
            var $textarea = $answerRow.find('textarea');

            if (!$textarea.length) {
                alert('Textarea не найдена');
                return;
            }

            $answerRow.show();

            var $descriptionRow = $row.next();
            var vacancyText = $descriptionRow.find('.description-full').text().trim();
            if (!vacancyText) {
                vacancyText = $descriptionRow.find('.description-short').text().trim();
            }

            var originalText = $btn.text();
            $btn.text('Генерация...').prop('disabled', true);

            jQuery.ajax({
                url: '/chat/vacancy/answer/generate',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({text: vacancyText}),
                beforeSend: function (xhr) {
                    if (typeof csrfToken !== 'undefined' && typeof csrfHeader !== 'undefined') {
                        xhr.setRequestHeader(csrfHeader, csrfToken);
                    }
                },
                success: function (response) {
                    $textarea.val(response);
                    $btn.text(originalText).prop('disabled', false);
                },
                error: function (xhr, status, error) {
                    alert('Ошибка: ' + error);
                    $textarea.val('Ошибка: ' + error);
                    $btn.text(originalText).prop('disabled', false);
                }
            });
        }

        function sendAnswer(button) {
            var $btn = jQuery(button);
            var $row = $btn.closest('tr');
            var $textarea = $row.find('textarea');

            if (!$textarea.length) {
                alert('Textarea не найдена');
                return;
            }

            var message = $textarea.val().trim();
            if (!message) {
                alert('Сначала сгенерируйте ответ');
                return;
            }

            var $vacancyRow = $row.prevAll('tr[id^="head-"]').first();
            var username = $vacancyRow.find('.tgvalue').text().trim();

            if (!username) {
                username = $vacancyRow.find('td').first().text().trim();
            }

            if (!username) {
                alert('Не найден username для отправки');
                return;
            }

            var tgAccountId = jQuery('#tgAccounts').val();
            if (!tgAccountId || tgAccountId.length === 0) {
                alert('Выберите ТГ-аккаунт');
                return;
            }
            if (Array.isArray(tgAccountId)) {
                tgAccountId = tgAccountId[0];
            }

            var originalText = $btn.text();
            $btn.text('Отправка...').prop('disabled', true);

            jQuery.ajax({
                url: '/chat/vacancy/answer/send',
                type: 'POST',
                data: {
                    message: message,
                    username: username,
                    tgAccountId: tgAccountId
                },
                beforeSend: function (xhr) {
                    if (typeof csrfToken !== 'undefined' && typeof csrfHeader !== 'undefined') {
                        xhr.setRequestHeader(csrfHeader, csrfToken);
                    }
                },
                success: function (response) {
                    $btn.text(originalText).prop('disabled', false);
                    if (response.success) {
                        var $successDiv = jQuery('.alert-success');
                        if ($successDiv.length) {
                            $successDiv.text(response.success).show();
                        } else {
                            jQuery('.conteiner').prepend(
                                '<div class="alert alert-success" style="display:block;">' + response.success + '</div>'
                            );
                        }
                    } else if (response.error) {
                        var $errorDiv = jQuery('.alert-danger');
                        if ($errorDiv.length) {
                            $errorDiv.text(response.error).show();
                        } else {
                            jQuery('.conteiner').prepend(
                                '<div class="alert alert-danger" style="display:block;">' + response.error + '</div>'
                            );
                        }
                    }
                },
                error: function (xhr, status, error) {
                    alert('Ошибка: ' + error);
                    $btn.text(originalText).prop('disabled', false);
                }
            });
        }
    </script>

    <table class="vacancies list">
        <thead>
        <tr id="header">
            <th id="title" class="table-alias"></th>
            <th class="table-description"></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="item, iter : ${data.vacancies}">
            <tr id="head-${iter.index}" th:class="${'vacancy' + (item.status)}">
                <td><span th:text="${item.title}">Title</span></td>
                <td>
                    <span class="dt" th:text="${#temporals.format(item.dateTime, 'dd.MM.YYYY HH:mm')}">Datetime</span>
                </td>
                <td>
                    <table border="1" class="owners">
                        <tr th:each="owner : ${item.owners}">
                            <td class="tgvalue" th:text="${owner.value}"></td>
                            <td th:text="${owner.type}"></td>
                        </tr>
                    </table>
                </td>
                <td>
                    <button id="generate-${iter.index}" class="save generate" type="submit" onclick="generateAnswer(this)">
                        Генерировать ответ
                    </button>
                </td>
            </tr>
            <tr id="text-${iter.index}" th:class="${'vacancy' + (item.status)}">
                <td colspan="4" class="description">
                    <span th:id="'short-' + ${iter.index}" class="description-short"
                          th:text="${#strings.abbreviate(item.text, 100)}"></span>
                    <span th:id="'full-' + ${iter.index}" class="description-full" style="display:none;"
                          th:text="${item.text}"></span>
                    <a href="#" th:attr="data-short='short-' + ${iter.index}, data-full='full-' + ${iter.index}"
                       class="description-toggle">Развернуть</a>
                </td>
            </tr>
            <tr id="answer-${iter.index}" class="answer" th:classappend="${'vacancy' + (item.status)}">
                <td colspan="3" class="answervalue">
                    <textarea id="answervalue-${iter.index}" rows="4" style="width:100%;"></textarea>
                </td>
                <td>
                    <button id="send-${iter.index}" class="save" type="submit" onclick="sendAnswer(this)">Послать
                        ответ
                    </button>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <script>
        document.querySelectorAll('.description-toggle').forEach(function(btn) {
            btn.onclick = function(e) {
                e.preventDefault();
                var shortSpan = document.getElementById(this.getAttribute('data-short'));
                var fullSpan = document.getElementById(this.getAttribute('data-full'));
                if (fullSpan.style.display === 'none') {
                    shortSpan.style.display = 'none';
                    fullSpan.style.display = 'inline';
                    this.innerText = 'Свернуть';
                } else {
                    shortSpan.style.display = 'inline';
                    fullSpan.style.display = 'none';
                    this.innerText = 'Развернуть';
                }
            };
        });

        jQuery.each(jQuery("table.owners"), function (key, value) {
            if (jQuery(value).find("tr").length == 0) {
                jQuery(value).parents(".vacancynull").find(".generate").hide();
            }
        })
    </script>
</div>
