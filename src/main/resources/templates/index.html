<script>
    const url = window.location.href;
    const urlSplit = url.split("/");
    const pageName = urlSplit[urlSplit.length - 2];
    document.querySelector(`#js__${pageName}`).classList.add('page-active');

    var pageLink = location.protocol + '//' + location.host + location.pathname;
    var sort = (new URLSearchParams(window.location.search)).get("sort");
    var dir = (new URLSearchParams(window.location.search)).get("dir");

    jQuery.each(jQuery("table.list tr#header th"), function (k, v) {
        if (jQuery(v).attr("id") !== undefined) {
            var id = jQuery(v).attr("id");
            if (sort == id) {
                jQuery(v).addClass("sortcol");
                jQuery(v).addClass(dir);
            } else {
                jQuery(v).removeClass("sortcol");
                jQuery(v).removeClass("desc");
                jQuery(v).removeClass("asc");
            }

            ndir = "desc";
            if (jQuery(v).hasClass("desc")) {
                ndir = "asc";
            }
            jQuery(v).html(
                "<a href='" + pageLink + "?sort=" + id + "&dir=" + ndir + "'>"
                + jQuery(v).html() + "<span class='arrow'></span></a>"
            );
        }
    })

    jQuery.ajax({
        url: jQuery("#js__info").attr("href"),
        success: function (data) {
            jQuery("#js__logout").html(data);
        }
    })
    jQuery("#js__logout").removeAttr("href");
    jQuery("#js__logout").css("pointer-events", "none");

    jQuery('ul.top-menu li #js__logs').hover(
        function () {
            $(this).parent().find('ul').stop().slideDown();
        },
        function () {
            $(this).parent().find('ul').stop().slideUp();
        }
    );

    jQuery('ul.top-menu li .logsmenu').hover(
        function () {
            $(this).stop().slideDown();
        },
        function () {
            $(this).stop().slideUp();
        }
    );
    jQuery(document).ready(function () {
        jQuery(".btn-send, .btn-remove, .btn-restore").on("click", function (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
            console.log(jQuery(this).attr("href"));
            jQuery.ajax({
                url: jQuery(this).attr("href"),
                method: "POST",
                success: function () {
                    location.reload();
                }
            });
        });
    });
    jQuery(document).ready(function () {
        jQuery('select[name="filter"]').change(function () {
            var selectedSort = $(this).val();
            var sortValue = '';


        });
    });
</script>

<script>
    // Функция открытия превью
    window.openChatPreview = function (chatId, chatName) {
        var url = '/chat/' + chatId + '/messages';
        if (typeof Fancybox !== 'undefined') {
            Fancybox.show([{src: url, type: 'ajax', preload: false}]);
        } else if (typeof jQuery !== 'undefined' && jQuery.fancybox) {
            jQuery.fancybox.open({href: url, type: 'ajax', width: 600, height: 500});
        } else {
            window.open(url, '_blank');
        }
    };

    // Таймеры для задержки
    var previewTimeout = null;

    // Делегирование событий
    if (typeof jQuery !== 'undefined') {
        // Клик по ссылке — мгновенно
        jQuery(document).on('click', '.chat-preview-link', function (e) {
            e.preventDefault();
            var chatId = $(this).data('chat-id');
            var chatName = $(this).data('chat-name');
            openChatPreview(chatId, chatName);
        });

        // Клик по аватару — мгновенно
        jQuery(document).on('click', '.chat-avatar', function () {
            var chatId = $(this).data('chat-id');
            var chatName = $(this).data('chat-name');
            openChatPreview(chatId, chatName);
        });

        // Наведение на аватар — с задержкой 2 секунды
        jQuery(document).on('mouseenter', '.chat-avatar', function () {
            var $this = $(this);
            var chatId = $this.data('chat-id');
            var chatName = $this.data('chat-name');

            if (previewTimeout) {
                clearTimeout(previewTimeout);
            }

            previewTimeout = setTimeout(function () {
                openChatPreview(chatId, chatName);
                previewTimeout = null;
            }, 2000);
        });

        // Уход мыши с аватара — отменяем таймер
        jQuery(document).on('mouseleave', '.chat-avatar', function () {
            if (previewTimeout) {
                clearTimeout(previewTimeout);
                previewTimeout = null;
            }
        });
    }
</script>
