<main th:fragment="employees-directions" class="row">
    <h1 th:text="${title}"></h1>
    <div class="col p-4">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Ид</th>
                    <th scope="col">Название</th>
                    <th scope="col">Операции</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="direction : ${developmentDirections}">
                    <th scope="row" th:inline="text">[[${direction.getId()}]]</th>
                    <td th:inline="text">[[${direction.getName()}]]</td>
                    <td>
                        <form th:action="@{/employees/directions/{id}(id=${direction.getId()})}"
                              th:method="delete"
                              class="d-inline-flex">
                            <button type="submit"
                                    onclick="return confirm('Вы уверены, что хотите удалить это направление?');"
                                    class="btn-solid btn-styled theme-danger btn-xs">Удалить</button>
                        </form>
                        <a th:href="@{/employees/directions/{id}(id=${direction.getId()})}" class="btn-solid btn-styled theme-warning btn-xs">Редактировать</a>
                    </td>
                </tr>
                <tr>
                    <th></th>
                    <td></td>
                    <td>
                        <a th:href="@{/employees/directions/add/}"
                           class="btn-solid btn-styled theme-primary btn-sm">Добавить направление разработки</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
