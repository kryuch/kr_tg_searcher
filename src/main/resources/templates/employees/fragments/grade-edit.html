<main th:fragment="main" class="row">
    <h1 th:text="${title}"></h1>
    <div class="col p-4">
        <form th:action="@{/employees/grades/{id}/(id=${item.getId()})}"
              th:method="PATCH">
            <div class="mb-3">
                <label class="form-label" for="name">Название:</label>
                <input class="form-control" id="name" type="text" name="name" th:value="${item.getName()}">
            </div>
            <button class="btn-solid theme-primary" type="submit">Сохранить</button>
        </form>
    </div>
</main>
