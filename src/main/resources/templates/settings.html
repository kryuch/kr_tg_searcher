<div class="icontent">
    <form action="#" th:action="@{/settings/save}" th:object="${items}"
          class="edit-form form-horizontal" method="post">
        <div id="tabs">
            <ul>
                <li><a href="#tabs-cron">Крон</a></li>
                <li><a href="#tabs-folder">Папка</a>
                <li><a href="#tabs-other">Прочее</a></li>
            </ul>
            <div id="tabs-cron">
                <table class="list">
                    <thead>
                    <tr id="header">
                        <th class="table-alias">Параметр</th>
                        <th id="rate" class="table-description"> Значение</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                    <th:block th:each="view, iter : ${views}">
                    <tr>
                        <td><span th:text="${view.title}">Заголовок</span></td>
                        <td th:id="${view.code}">
                            <input th:if="${view.isCheckbox}" type="checkbox" id="${view.code}_value"/>
                        </td>
                    </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div id="tabs-other">
                <table class="list">
                    <thead>
                    <tr id="header">
                        <th class="table-alias">Параметр</th>
                        <th id="rate" class="table-description"> Значение</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:if="${items.settings.empty}">
                        <td colspan="2"> Тут пусто</td>
                    </tr>

                    <th:block th:each="item, iter : *{settings}">
                        <tr id="setting">
                            <td id="code">
                                <input th:field="*{settings[__${iter.index}__].code}" readonly="readonly"/>
                            </td>
                            <td id="value">
                                <input th:field="*{settings[__${iter.index}__].value}"
                                       th:data="*{settings[__${iter.index}__].code}"/>
                            </td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>
        <button class="save" type="submit">Сохранить</button>
        <script>
            jQuery(function () {
                jQuery.each(["cron_time", "cron_lastmessage", "cron_newmessage", "cron_chats_count"], function (index, field) {
                    console.log(field);
                    var td = jQuery("input[data=" + field + "]").parent();
                    jQuery("td#" + field).html(td.html());
                    td.parent().hide();
                    td.remove();
                })

                jQuery.each(["term", "max_day", "cron_lastrun"], function (index, field) {
                    var value = jQuery("input[data=" + field + "]").val();
                    jQuery("td#" + field).html(value);
                })

                jQuery("input[data=cron_lastrun]").parents("tr").hide();
                jQuery("input[data=cron_enable]").parents("tr").hide();

                jQuery("#cron_enable_value").prop("checked", Number(jQuery("input[data=cron_enable]").val()) == 1);
                jQuery("#tabs").tabs();

                jQuery("#cron_enable_value").on("click", function() {
                    var checkFlag = jQuery("#cron_enable_value").prop("checked");
                    console.log(checkFlag);
                    jQuery("input[data=cron_enable]").val((checkFlag) ? "1" : "0");
                })
            });
        </script>
    </form>
</div>
