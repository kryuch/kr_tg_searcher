<div class="icontent">
    <form action="#" th:action="@{/settings/save}" th:object="${items}"
          class="edit-form form-horizontal settingform" method="post">
        <div id="tabs">
            <ul>
                <li th:each="group : ${groups}">
                    <a th:href="'#tabs-' + ${group.code}" th:text="${group.title}">Группа</a>
                </li>
            </ul>

            <div th:each="group : ${groups}" th:id="'tabs-' + ${group.code}">
                <table class="list">
                    <thead>
                    <tr id="header">
                        <th class="table-alias">Параметр</th>
                        <th id="rate" class="table-description">Значение</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="idx : ${items.groupedIndices[group.code]}"
                        th:class="${items.settings[idx].code == group.code + '_enable' or items.settings[idx].code == group.code + '_enabled'} ? 'settings-master-row' : ''">
                        <td class="settingcode"><span th:text="*{settings[__${idx}__].title}">Заголовок</span></td>
                        <td>
                            <input type="hidden" th:field="*{settings[__${idx}__].code}"/>

                            <input type="checkbox"
                                   th:if="*{settings[__${idx}__].type.name()} == 'BOOLEAN'"
                                   th:field="*{settings[__${idx}__].boolValue}"/>

                            <input type="number" step="1"
                                   th:if="*{settings[__${idx}__].type.name()} == 'INTEGER'"
                                   th:field="*{settings[__${idx}__].intValue}"/>

                            <input type="number" step="any"
                                   th:if="*{settings[__${idx}__].type.name()} == 'DOUBLE'"
                                   th:field="*{settings[__${idx}__].doubleValue}"/>

                            <input type="text"
                                   th:if="${items.settings[idx].type.name() == 'STRING' and !(items.settings[idx].getIsLarge() == true)}"
                                   th:field="*{settings[__${idx}__].stringValue}"/>

                            <textarea rows="6"
                                      th:if="${items.settings[idx].type.name() == 'STRING' and items.settings[idx].getIsLarge() == true}"
                                      th:field="*{settings[__${idx}__].stringValue}"></textarea>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="save" type="submit">Сохранить</button>

        <script>
            jQuery(function () {
                jQuery("#tabs").tabs();

                function updateGroupState($table) {
                    var $masterCheckbox = $table.find("tr.settings-master-row input[type=checkbox]");
                    if ($masterCheckbox.length === 0) {
                        return;
                    }
                    var enabled = $masterCheckbox.prop("checked");

                    $table.find("tbody tr").each(function () {
                        var $row = jQuery(this);

                        if ($row.hasClass("settings-master-row")) {
                            return;
                        }

                        $row.css("opacity", enabled ? "1" : "0.5");

                        // Текстовые/числовые/большие текстовые поля — readonly (значение всё равно уйдёт при сабмите).
                        $row.find("input[type=text], input[type=number], textarea").prop("readonly", !enabled);

                        // Чекбоксы намеренно НЕ делаем disabled/readonly:
                        // - readonly на чекбоксы не действует в браузерах;
                        // - disabled исключил бы значение из отправки формы и стёр бы его при сохранении.
                        // Вместо этого просто блокируем клик программно, оставляя атрибуты как есть.
                        $row.find("input[type=checkbox]").data("settings-locked", !enabled);
                    });
                }

                jQuery(".list").each(function () {
                    var $table = jQuery(this);
                    updateGroupState($table);

                    $table.find("tr.settings-master-row input[type=checkbox]").on("change", function () {
                        updateGroupState($table);
                    });

                    $table.on("click", "tbody tr:not(.settings-master-row) input[type=checkbox]", function (e) {
                        if (jQuery(this).data("settings-locked")) {
                            e.preventDefault();
                        }
                    });
                });
            });
        </script>
    </form>
</div>
