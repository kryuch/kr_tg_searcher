<div class="icontent">
    <form action="#" th:action="@{/settings/save}" th:object="${items}"
          class="edit-form form-horizontal" method="post">
        <div id="tabs">
            <ul>
                <li><a href="#tabs-cron">Крон</a></li>
                <li><a href="#tabs-folder">Папка</a></li>
                <li><a href="#tabs-email">Почта</a></li>
                <li><a href="#tabs-ai">ИИ</a></li>
                <li><a href="#tabs-resume">Резюме</a></li>
                <li><a href="#tabs-other">Прочее</a></li>
            </ul>

            <!-- Вкладки Крон и Папка в цикле -->
            <th:block th:each="entry : ${views}">
                <div th:id="${entry.key}">
                    <table class="list">
                        <thead>
                        <tr id="header">
                            <th class="table-alias">Параметр</th>
                            <th id="rate" class="table-description">Значение</th>
                        </tr>
                        </thead>
                        <tbody>
                        <th:block th:each="view : ${entry.value}">
                            <tr>
                                <td class="settingcode"><span th:text="${view.title}">Заголовок</span></td>
                                <td th:id="${view.code}">
                                    <input th:if="${view.isCheckbox}"
                                           type="checkbox"
                                           th:id="${view.code} + '_value'"/>
                                    <span th:unless="${view.isCheckbox}">
                                            <!-- Здесь будет значение из items.settings -->
                                        </span>
                                </td>
                            </tr>
                        </th:block>
                        </tbody>
                    </table>
                </div>
            </th:block>

            <!-- Вкладка Прочее (отдельно, как было) -->
            <div id="tabs-other">
                <table class="list">
                    <thead>
                    <tr id="header">
                        <th class="table-alias">Параметр</th>
                        <th id="rate" class="table-description">Значение</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${items.settings.empty}">
                        <td colspan="2">Тут пусто</td>
                    </tr>
                    <th:block th:each="item, iter : *{settings}">
                        <tr id="setting">
                            <td id="code">
                                <input th:field="*{settings[__${iter.index}__].code}" readonly="readonly"/>
                            </td>
                            <td id="value">
                                <input th:field="*{settings[__${iter.index}__].value}"
                                       th:data="*{settings[__${iter.index}__].code}"/>
                            </td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="save" type="submit">Сохранить</button>

        <script>
            jQuery(function () {
                // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===

                /**
                 * Обновляет состояние полей на вкладке
                 */
                function updateTabFieldsState(tabId, checkboxId, dataField) {
                    var isEnabled = jQuery(checkboxId).prop("checked");
                    var rows = jQuery(tabId + " tbody tr");

                    rows.each(function () {
                        var $row = jQuery(this);
                        var hasCheckbox = $row.find(checkboxId).length > 0;

                        if (hasCheckbox) {
                            return;
                        }

                        if (isEnabled) {
                            $row.css("opacity", "1");
                            $row.find("input, textarea").prop("readonly", false).prop("disabled", false);
                            $row.find("select, button").prop("disabled", false);
                            $row.css("cursor", "default");
                            $row.find("input, textarea").css("background-color", "");
                            $row.find("input, textarea").css("color", "");
                        } else {
                            $row.css("opacity", "0.5");
                            $row.find("input, textarea").prop("readonly", true).prop("disabled", false);
                            $row.find("select, button").prop("disabled", true);
                            $row.css("cursor", "not-allowed");
                            $row.find("input, textarea").css("background-color", "#e9ecef");
                            $row.find("input, textarea").css("color", "#6c757d");
                        }
                    });
                }
                /**
                 * Инициализирует поведение вкладки с чекбоксом-переключателем
                 */
                function initTabWithToggle(tabId, checkboxId, dataField) {
                    updateTabFieldsState(tabId, checkboxId, dataField);

                    jQuery(checkboxId).on("change", function () {
                        jQuery("input[data=" + dataField + "]").val(jQuery(checkboxId).prop("checked") ? "1" : "0");
                        updateTabFieldsState(tabId, checkboxId, dataField);
                    });
                }

                // === ИНИЦИАЛИЗАЦИЯ ВКЛАДОК ===

                // 1. Обработка полей с переносом значения в td
                jQuery.each([
                    "cron_time", "cron_lastmessage", "cron_newmessage", "cron_chats_count", "folder",
                    "gmail_email", "gmail_subject", "gmail_refresh_token",
                    "ai_model", "ai_api_key", "ai_vacancy_promt"
                ], function (index, field) {
                    var input = jQuery("input[data=" + field + "]");
                    var td = input.parent();
                    jQuery("td#" + field).html(td.html());
                    td.parent().hide();
                    td.remove();
                })

                // 2. Обработка полей с отображением значения как текст
                jQuery.each(["term", "max_day", "cron_lastrun"], function (index, field) {
                    var value = jQuery("input[data=" + field + "]").val();
                    jQuery("td#" + field).html(value);
                })

                // 3. Скрытие служебных строк
                jQuery.each(["cron_lastrun", "cron_enable", "folder_enable", "add_to_folder", "ai_enable"], function (index, field) {
                    jQuery("input[data=" + field + "]").parents("tr").hide();
                })

                // 4. Инициализация jQuery UI Tabs
                jQuery("#tabs").tabs();

                // 5. Установка начальных состояний чекбоксов
                jQuery.each(["cron_enable", "folder_enable", "add_to_folder", "ai_enable"], function (index, field) {
                    jQuery("#" + field + "_value").prop("checked", Number(jQuery("input[data=" + field + "]").val()) == 1);

                    jQuery("#" + field + "_value").on("click", function () {
                        jQuery("input[data=" + field + "]").val((jQuery("#" + field + "_value").prop("checked")) ? "1" : "0");
                    });
                })

                // === ВКЛАДКА РЕЗЮМЕ ===
                var resumeInput = jQuery("input[data=resume]");
                var resumeTd = jQuery("td#resume");

                if (resumeInput.length && resumeTd.length) {
                    var resumeValue = resumeInput.val() || "";
                    var textarea = jQuery('<textarea id="resume_textarea" rows="10" cols="50" style="width: 100%;">' + resumeValue + '</textarea>');
                    resumeTd.html(textarea);
                    resumeInput.parents("tr").hide();
                }

                var saveButton = jQuery(".save");
                var resumeTextarea = jQuery("#resume_textarea");

                saveButton.on("click", function () {
                    if (resumeTextarea.length && resumeInput.length) {
                        resumeInput.val(resumeTextarea.val());
                    }
                });

                resumeTextarea.on("change keyup input", function () {
                    if (resumeInput.length) {
                        resumeInput.val(resumeTextarea.val());
                    }
                });

                // === ИНИЦИАЛИЗАЦИЯ ВКЛАДОК С ПЕРЕКЛЮЧАТЕЛЯМИ ===
                initTabWithToggle("#tabs-cron", "#cron_enable_value", "cron_enable");
                initTabWithToggle("#tabs-ai", "#ai_enable_value", "ai_enable");
                initTabWithToggle("#tabs-folder", "#folder_enable_value", "folder_enable");
            });
        </script>
    </form>
</div>
