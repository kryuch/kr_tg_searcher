                jQuery("#tabs").tabs();

                function updateGroupState($table) {
                    var $masterCheckbox = $table.find("tr.settings-master-row input[type=checkbox]");
                    if ($masterCheckbox.length === 0) {
                        return;
                    }
                    var enabled = $masterCheckbox.prop("checked");

                    $table.find("tbody tr").each(function () {
                        var $row = jQuery(this);

                        if ($row.hasClass("settings-master-row")) {
                            return;
                        }

                        $row.css("opacity", enabled ? "1" : "0.5");

                        // Текстовые/числовые/большие текстовые поля — readonly (значение всё равно уйдёт при сабмите).
                        $row.find("input[type=text], input[type=number], textarea").prop("readonly", !enabled);

                        // Чекбоксы намеренно НЕ делаем disabled/readonly:
                        // - readonly на чекбоксы не действует в браузерах;
                        // - disabled исключил бы значение из отправки формы и стёр бы его при сохранении.
                        // Вместо этого просто блокируем клик программно, оставляя атрибуты как есть.
                        $row.find("input[type=checkbox]").data("settings-locked", !enabled);
                    });
                }

                jQuery(".list").each(function () {
                    var $table = jQuery(this);
                    updateGroupState($table);

                    $table.find("tr.settings-master-row input[type=checkbox]").on("change", function () {
                        updateGroupState($table);
                    });

                    $table.on("click", "tbody tr:not(.settings-master-row) input[type=checkbox]", function (e) {

                            e.preventDefault();

                    });
                });
