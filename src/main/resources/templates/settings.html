<div class="icontent">
    <form action="#" th:action="@{/settings/save}" th:object="${items}"
          class="edit-form form-horizontal" method="post">
        <div id="tabs">
            <ul>
                <li><a href="#tabs-cron">Крон</a></li>
                <li><a href="#tabs-folder">Папка</a></li>
                <li><a href="#tabs-other">Прочее</a></li>
            </ul>

            <!-- Вкладки Крон и Папка в цикле -->
            <th:block th:each="entry : ${views}">
                <div th:id="${entry.key}">
                    <table class="list">
                        <thead>
                        <tr id="header">
                            <th class="table-alias">Параметр</th>
                            <th id="rate" class="table-description">Значение</th>
                        </tr>
                        </thead>
                        <tbody>
                        <th:block th:each="view : ${entry.value}">
                            <tr>
                                <td class="settingcode"><span th:text="${view.title}">Заголовок</span></td>
                                <td th:id="${view.code}">
                                    <input th:if="${view.isCheckbox}"
                                           type="checkbox"
                                           th:id="${view.code} + '_value'"/>
                                    <span th:unless="${view.isCheckbox}">
                                            <!-- Здесь будет значение из items.settings -->
                                        </span>
                                </td>
                            </tr>
                        </th:block>
                        </tbody>
                    </table>
                </div>
            </th:block>

            <!-- Вкладка Прочее (отдельно, как было) -->
            <div id="tabs-other">
                <table class="list">
                    <thead>
                    <tr id="header">
                        <th class="table-alias">Параметр</th>
                        <th id="rate" class="table-description">Значение</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${items.settings.empty}">
                        <td colspan="2">Тут пусто</td>
                    </tr>
                    <th:block th:each="item, iter : *{settings}">
                        <tr id="setting">
                            <td id="code">
                                <input th:field="*{settings[__${iter.index}__].code}" readonly="readonly"/>
                            </td>
                            <td id="value">
                                <input th:field="*{settings[__${iter.index}__].value}"
                                       th:data="*{settings[__${iter.index}__].code}"/>
                            </td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="save" type="submit">Сохранить</button>

        <script>
            jQuery(function () {
                jQuery.each(["cron_time", "cron_lastmessage", "cron_newmessage", "cron_chats_count", "folder"], function (index, field) {
                    var input = jQuery("input[data=" + field + "]");
                    var td = input.parent();
                    jQuery("td#" + field).html(td.html());
                    td.parent().hide();
                    td.remove();
                })

                jQuery.each(["term", "max_day", "cron_lastrun"], function (index, field) {
                    var value = jQuery("input[data=" + field + "]").val();
                    jQuery("td#" + field).html(value);
                })

                jQuery("input[data=cron_lastrun]").parents("tr").hide();
                jQuery("input[data=cron_enable]").parents("tr").hide();

                jQuery("#cron_enable_value").prop("checked", Number(jQuery("input[data=cron_enable]").val()) == 1);
                jQuery("#folder_enable_value").prop("checked", Number(jQuery("input[data=folder_enable]").val()) == 1);
                jQuery("#add_to_folder_value").prop("checked", Number(jQuery("input[data=add_to_folder]").val()) == 1);
                jQuery("#tabs").tabs();

                jQuery("#cron_enable_value").on("click", function() {
                    jQuery("input[data=cron_enable]").val((jQuery("#cron_enable_value").prop("checked")) ? "1" : "0");
                })
                jQuery("#folder_enable_value").on("click", function() {
                    jQuery("input[data=folder_enable]").val((jQuery("#folder_enable_value").prop("checked")) ? "1" : "0");
                })
                jQuery("#add_to_folder_value").on("click", function() {
                    jQuery("input[data=add_to_folder]").val((jQuery("#add_to_folder_value").prop("checked")) ? "1" : "0");
                })
            });
        </script>
    </form>
</div>
