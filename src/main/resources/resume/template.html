<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title th:text="${view.fullName}">Резюме</title>
    <style type="text/css">
        @page {
            size: A4;
            margin: 16mm 15mm;
        }

        body {
            font-family: Arial, "Liberation Sans", sans-serif;
            font-size: 10pt;
            color: #222222;
            line-height: 1.45;
            margin: 0;
        }

        h1 {
            font-size: 22pt;
            font-weight: bold;
            color: #16243d;
            margin: 0 0 4pt 0;
        }

        .meta {
            font-size: 9.5pt;
            color: #555555;
            margin: 0 0 14pt 0;
        }

        h2 {
            font-size: 12pt;
            font-weight: bold;
            color: #16243d;
            margin: 14pt 0 6pt 0;
            padding-bottom: 2pt;
            border-bottom: 1pt solid #c9d3e0;
        }

        .entry {
            margin: 0 0 8pt 0;
        }

        .entry-title {
            font-weight: bold;
        }

        .entry-period {
            font-weight: normal;
            color: #666666;
        }

        .entry-sub {
            color: #444444;
        }

        .block-label {
            font-weight: bold;
            color: #444444;
            margin: 6pt 0 2pt 0;
        }

        .project {
            margin: 0 0 10pt 0;
        }

        .description {
            margin: 2pt 0;
        }

        .technologies {
            font-size: 9pt;
            color: #444444;
            margin: 2pt 0 0 0;
        }

        ul.skills {
            margin: 2pt 0 4pt 0;
            padding-left: 14pt;
        }

        ul.skills li {
            margin: 0 0 1pt 0;
        }

        .skill-level,
        .skill-category {
            color: #666666;
        }
    </style>
</head>
<body>

<h1 th:text="${view.fullName}">Иванова Мария</h1>
<p class="meta" th:if="${view.metaVisible}" th:text="${view.meta}">12.05.1990 · Женщина · Россия</p>

<div th:if="${view.educationVisible}">
    <h2>ОБРАЗОВАНИЕ</h2>
    <div class="entry" th:each="item : ${view.education}">
        <div class="entry-title">
            <span th:text="${item.university}">Университет</span>
            <span class="entry-period" th:if="${item.periodVisible}" th:text="| (${item.period})|"></span>
        </div>
        <div class="entry-sub" th:if="${item.detailsVisible}" th:text="${item.details}"></div>
    </div>
</div>

<div th:each="profile : ${view.profiles}">
    <h2 th:text="${profile.title}">Java · Senior</h2>

    <div th:if="${profile.skillsVisible}">
        <div class="block-label">Навыки</div>
        <ul class="skills">
            <li th:each="skill : ${profile.skills}">
                <span class="skill-name" th:text="${skill.name}">Java</span><span class="skill-level"
                    th:if="${skill.levelVisible}" th:text="| — ${skill.levelLabel}|"></span><span class="skill-category"
                    th:if="${skill.categoryVisible}" th:text="| (${skill.category})|"></span>
            </li>
        </ul>
    </div>

    <div th:if="${profile.projectsVisible}">
        <div class="block-label">Проекты</div>
        <div class="project" th:each="project : ${profile.projects}">
            <div class="entry-title" th:text="${project.title}">Пример — Разработчик</div>
            <div class="entry-sub" th:if="${project.periodVisible}" th:text="${project.period}"></div>
            <div class="description" th:if="${project.descriptionVisible}" th:text="${project.description}">Разработка сервиса</div>
            <div class="technologies" th:if="${project.technologiesVisible}"
                 th:text="|Технологии: ${project.technologies}|">Технологии: Java, Spring Boot</div>
        </div>
    </div>
</div>

</body>
</html>
