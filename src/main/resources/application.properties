spring.application.name=tg-searcher
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.servlet.session.tracking-modes=cookie
app.file-storage.path=/data/project/tg_searcher/kr_tg_searcher/var/files/

# Логирование процесса аутентификации Spring Security
logging.level.org.springframework.security.authentication.dao=TRACE
logging.level.org.springframework.security.web.authentication=DEBUG

# Если вы используете Hibernate/Spring Data JPA, это покажет SQL-запросы и параметры
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# Включает поддержку методов PUT, DELETE и PATCH для HTML-форм
spring.mvc.hiddenmethod.filter.enabled=true
